                image_url: {type: string, minLength: 8, maxLength: 12000000}
                hint: {type: string, maxLength: 200, default: booking confirmation}
      responses:
        '201': {description: DeepSeek Responses vision extraction draft, content: {application/json: {schema: {type: object}}}}
        '502': {description: 'ORD-0551: the extraction provider refused this image; no draft was created. The body names the machine status (FAILED_EXTERNAL) and the provider reason.', content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/web-research:
    post:
