components:
  parameters:
    DemoResetToken:
      # ORD-0389: the claim that opens the whole-library reset.  Optional in the schema because a
      # caller who omits it must still get a named answer (RESET_TOKEN_REQUIRED) rather than a
      # transport-level 422 -- the refusal is the product behaviour being pinned.
      name: X-Demo-Reset-Token
      in: header
      required: false
      schema: {type: string}
    DemoSceneToken:
      # ORD-0521: the claim that opens the additive scene door.  Optional in the schema because a
      # caller who omits it must get the named refusal (SCENE_TOKEN_REQUIRED) rather than a
      # transport-level 422 -- the refusal is the behaviour being pinned.  It is a separate token
      # from the reset one on purpose: being allowed to build a demo is not being allowed to empty
      # the library, and a deployment can offer one door without the other.
      name: X-Demo-Scene-Token
      in: header
      required: false
      schema: {type: string}
    TravelerId:
      name: traveler_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JourneyId:
      name: journey_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CollectionFolderId:
      # ORD-0444: a shelf id, and deliberately NOT `format: uuid`.  The door reads the string as it
      # arrived and answers a shelf this server does not hold with `404 COLLECTION_FOLDER_NOT_FOUND`.
      # Declaring a uuid here would turn that same traveller action into a transport-level 422 and
      # take the named refusal away -- the ids this door hands out are uuid4 strings, but the shape
      # of a wrong one is a 404 with a name, not a parse error.
      name: folder_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 64}
    ActivityId:
      name: activity_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    EventId:
      name: event_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanVersionId:
      name: plan_version_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IdempotencyKeyOptional:
      # Same transport vocabulary, only `required` differs: an operation that may be called
      # without a client key references this sibling instead of restating the header.
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Input validation error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Infeasible:
      description: No feasible result under hard constraints
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    BadGateway:
      description: Upstream native runtime is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    V13NamedRejection:
      type: string
      description: >-
        ORD-0467. The named rejection codes this product answers with, as one closed
        vocabulary. Each is raised by name in the doors listed below and reaches a client
        as the first token of the error detail (`CODE` or `CODE: argument`), which is why
        `frontend/src/features/pending/pendingPlaceWrites.ts` and
        `frontend/src/features/discovery/RealCityDiscoveryPanel.tsx` match on it rather
        than reading a structured field -- they read what the server actually sent.
        Emission sites, read from this tree: .
        The credential gate (backend/app/security/credential_literals.py) may exempt a
        literal only when it is byte-identical to one of these members; a value shaped like
        a provider key is never exempted by contract membership.
      enum:
        - V13_ACTIVITY_OUTSIDE_DEPARTURE_WINDOW
        - V13_AUTHORITATIVE_BOUNDED_MULTIDAY
        - V13_C4_ANCHOR_NOT_IN_INPUT
        - V13_C4_ANCHOR_OUTSIDE_JOURNEY
        - V13_CHECK_OUT_DEPARTURE_BUFFER
        - V13_COMMITMENT_ANCHOR_DAY_CONFLICT
        - V13_COMMITMENT_ANCHOR_TOO_EARLY
        - V13_COMMITMENT_ANCHOR_TRAVEL_BUFFER
        - V13_COMMITMENT_OUTSIDE_OPENING_HOURS
        - V13_DAY_TRIP_CANNOT_SELECT_STAY
        - V13_DISCOVERY_COMPOSE_EMPTY
        - V13_DISCOVERY_NO_FEASIBLE_PLACE_SET
        - V13_DISCOVERY_NO_FEASIBLE_PLAN
        - V13_FULL_GROUNDING_MISSING_MOBILITY_PAIR
        - V13_INVALID_ANCHOR_WINDOW
        - V13_INVALID_C4_ANCHOR_TIME
        - V13_JOURNEY_DAYS_OUT_OF_BOUNDS
        - V13_STAY_CANDIDATE_UNAVAILABLE
        - V13_STAY_CHECK_IN_OUTSIDE_JOURNEY

    PlanningMode:
      type: string
      enum: [balanced, budget, explore, strict_schedule]
    HealthResponse:
      type: object
      required: [status, database, ai]
      properties:
        status: {type: string, enum: [ok, degraded]}
        database: {type: string, enum: [ok, error]}
        ai: {type: string, enum: [available, unavailable, disabled]}
        # ORD-0359: additive. `ai` keeps its two words for existing clients; `ai_state` names the
        # reason, which `ai` cannot do because it folds three different facts into one string.
        ai_state:
          type: string
          enum: [CONFIGURED_UNVERIFIED, NOT_CONFIGURED, DISABLED_BY_OPS, PROVIDER_REFUSED]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            trace_id: {type: string}
            # Shipped by ORD-0332: `trace_id` says which envelope the server built (fresh every time),
            # while `error_receipt_id` says which *call's* rejection this is, so a retry of the same
            # failing call reproduces it and a traveller can read it aloud.  Derived, not stored: see
            # `contracts/ERROR_RECEIPT_ID_V1.md` for the recipe and the alphabet.  Absent when the
            # rejection was not built inside a request - never an empty string.
            error_receipt_id: {type: string, pattern: '^CNX-[23456789ABCDEFGHJKMNPQRSTVWXYZ]{8}$'}
            # Shipped by ORD-0101/ORD-0108: `code` is the HTTP-level class, `message_key` is what
            # a screen looks up, and `reason_code` names *which* condition refused when one code
            # covers several.  Present only where a raise site knows one, so absence is a real
            # answer and not an empty string.
            message_key: {type: string}
            reason_code: {type: string}
    Error:
      $ref: '#/components/schemas/ErrorEnvelope'
    RecoveryState:
      description: >-
        Durable, governed recovery state.  Present only when a confirmed HARD
        capability (or an evidence regression) invalidated the active plan.
        The active plan is never silently mutated.
      type: object
      nullable: true
      required: [state, requires_user_decision, silent_plan_mutation]
      properties:
        state:
          type: string
          enum: [RECOVERY_REQUIRED, RECOVERY_REQUIRED_NO_ALTERNATIVE, RESOLVED]
        acknowledged: {type: boolean}
        acknowledged_at: {type: string, format: date-time, nullable: true}
        replan_attempted: {type: boolean}
        no_alternative: {type: boolean}
        kind: {type: string, example: CAPABILITY_HARD_RECOVERY}
        event_id: {type: string, format: uuid}
        event_status: {type: string, enum: [DETECTED, ACKNOWLEDGED, RESOLVED]}
        capability_code: {type: string, nullable: true}
        active_plan_version_id: {type: string, format: uuid, nullable: true}
        failures: {type: array, items: {type: string}}
        candidate_plan_count: {type: integer}
        candidate_plan_ids: {type: array, items: {type: string, format: uuid}}
        requires_user_decision: {type: boolean}
        silent_plan_mutation: {type: boolean, enum: [false]}
        actions:
          type: array
          items:
            type: string
            enum: [REPLAN, ACKNOWLEDGE_NO_ALTERNATIVE]
        detected_at: {type: string, format: date-time}
        journey_status: {type: string}
    TravelerCreate:
      type: object
      required: [display_name, timezone]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        email: {type: [string, 'null'], format: email}
        locale: {type: string, default: en-GB}
        timezone: {type: string}
    Traveler:
      allOf:
        - {$ref: '#/components/schemas/TravelerCreate'}
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    PreferenceInput:
      type: object
      required: [category, key, value, weight]
      properties:
        category: {type: string}
        key: {type: string}
        value: {}
        weight: {type: number, minimum: 0, maximum: 1}
    Preference:
      allOf:
        - {$ref: '#/components/schemas/PreferenceInput'}
        - type: object
          required: [id, traveler_id]
          properties:
            id: {type: string, format: uuid}
            traveler_id: {type: string, format: uuid}
    AgentPolicyPayload:
      type: object
      additionalProperties: false
      properties:
        mode: {type: string, enum: [ADVISORY, ASSISTED, AUTONOMOUS], default: ADVISORY}
        auto_accept_replan: {type: boolean, default: false}
        max_auto_replan_cost_delta_minor: {type: integer, minimum: 0, default: 0}
        max_auto_loss_minor: {type: integer, minimum: 0, default: 0}
        max_auto_schedule_drift_min: {type: integer, minimum: 0, default: 0}
        allowed_activity_types:
          type: array
          maxItems: 20
          items: {type: string}
        protected_commitment_levels:
          type: array
          maxItems: 5
          items: {type: string}
          default: [C3_Guaranteed, C4_Anchored]
        allow_auto_commitment_management: {type: boolean, default: false}
        allow_auto_when_provider_degraded: {type: boolean, default: false}
        allow_auto_on_critical_event: {type: boolean, default: false}
    AgentPolicy:
      allOf:
        - {$ref: '#/components/schemas/AgentPolicyPayload'}
        - type: object
          required: [traveler_id, version, created_at, updated_at]
          properties:
            traveler_id: {type: string, format: uuid}
            version: {type: integer, minimum: 1}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    AgentToolCall:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: {type: string, minLength: 8, maxLength: 128}
        agent_id: {type: string, minLength: 1, maxLength: 128, default: hermes}
        journey_id: {type: [string, 'null'], format: uuid}
        proposal_id: {type: [string, 'null'], format: uuid}
        trigger_event_id: {type: [string, 'null'], format: uuid}
        candidate_count: {type: integer, minimum: 1, maximum: 5, default: 3}
        approval_id: {type: [string, 'null'], format: uuid}
        activity_id: {type: [string, 'null'], format: uuid}
        replacement_activity_id: {type: [string, 'null'], format: uuid}
        replacement_place_id: {type: [string, 'null'], minLength: 1, maxLength: 128}
        booking_id: {type: [string, 'null'], format: uuid}
        commitment_id: {type: [string, 'null'], format: uuid}
        start_at: {type: [string, 'null'], format: date-time}
        end_at: {type: [string, 'null'], format: date-time}
        provider_key: {type: string, default: mock-booking}
        reason: {type: [string, 'null'], minLength: 1, maxLength: 500}
        user_confirmed: {type: boolean, default: false}
        city_code: {type: [string, 'null'], minLength: 1, maxLength: 32}
        q: {type: [string, 'null'], maxLength: 120}
        category: {type: [string, 'null'], maxLength: 80}
        service_type: {type: [string, 'null'], maxLength: 80}
    AgentToolDescriptor:
      type: object
      required: [name, action, mutates_domain_truth, changes_money, changes_c4]
      properties:
        name: {type: string}
        action: {type: string}
        mutates_domain_truth: {type: boolean}
        changes_money: {type: boolean}
        changes_c4: {type: boolean}
    AgentToolResponse:
      type: object
      additionalProperties: true
      properties:
        tool: {type: string}
        decision: {type: string, enum: [ALLOW_AUTO, REQUIRE_CONFIRMATION, REQUIRE_STEP_UP, DENY]}
    AgentCommandRequest:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command: {type: string, minLength: 8, maxLength: 2000}
        requested_autonomy:
          type: string
          enum: [PLAN_ONLY, EXECUTE_WITHIN_BOUNDS]
          default: EXECUTE_WITHIN_BOUNDS
    AgentCommandResponse:
      type: object
      required: [mission, event_id, run]
      properties:
        event_id: {type: string, format: uuid}
        mission: {type: object, additionalProperties: true}
        run: {type: object, additionalProperties: true}
    AgentRunResponse:
      type: object
      required: [run_id, mission_id, journey_id, status, tool_steps]
      properties:
        run_id: {type: string, format: uuid}
        mission_id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        provider_key: {type: string}
        model_key: {type: string}
        status: {type: string}
        outcome: {type: [string, 'null']}
        failure_reason: {type: [string, 'null']}
        mission_status: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        tool_steps:
          type: array
          items:
            type: object
            additionalProperties: true
    GuardianRun:
      type: object
      additionalProperties: true
      required: [id, journey_id, decision, status, action_status, deduplicated, evidence]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        decision: {type: string, enum: [NO_ACTION, WATCH, RECOVERY_REQUIRED]}
        status: {type: string}
        action_status: {type: string}
        deduplicated: {type: boolean}
        trigger_event_id: {type: [string, 'null'], format: uuid}
        proposal_id: {type: [string, 'null'], format: uuid}
        agent_run_id: {type: [string, 'null'], format: uuid}
        evidence: {type: object, additionalProperties: true}
        reasoning_summary: {type: string}
    AgentApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        approval_method:
          type: string
          enum: [USER_CONFIRMATION, STEP_UP, WEBAUTHN]
          default: USER_CONFIRMATION
        step_up_code:
          type: string
          minLength: 4
          maxLength: 128
          writeOnly: true
    AgentApprovalResponse:
      type: object
      required: [approval_id, journey_id, action, target_type, target_id, status, created_at, expires_at]
      properties:
        approval_id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, APPROVED, CONSUMED, EXPIRED, REVOKED]}
        approval_method: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        approved_at: {type: [string, 'null'], format: date-time}
        consumed_at: {type: [string, 'null'], format: date-time}
    JourneyCreate:
      type: object
      required: [traveler_id, title, city_code, timezone, start_at, end_at, budget]
      properties:
        traveler_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        city_code: {type: string}
        timezone: {type: string}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        budget: {$ref: '#/components/schemas/Money'}
        planning_mode: {$ref: '#/components/schemas/PlanningMode'}
    JourneyPatch:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        budget: {$ref: '#/components/schemas/Money'}
    JourneyAbort:
      type: object
      additionalProperties: false
      description: >-
        ORD-0520: what the traveller says when they call their own trip off.  `reason` is kept as
        given and stored on the row, so a later screen reads the traveller's sentence rather than
        inventing one; `actor_traveler_id` is the declared identity the door compares against
        `journeys.traveler_id`.
      required: [reason, actor_traveler_id]
      properties:
        reason: {type: string, minLength: 1, maxLength: 240}
        actor_traveler_id: {type: string, format: uuid}
    JourneyLiveView:
      type: object
      description: >-
        The server's own answer to "does this trip belong on 实时行程" (ORD-0520).  Shipped as a
        field rather than left to the device because a screen that filtered the status itself would
        hold a second copy of the rule, and the two would disagree the first time the rule grows a
        case the client has not heard of.  `reason_code` is the same token the abort door answers
        with, and is null when nothing excludes the trip.
      required: [included]
      properties:
        included: {type: boolean}
        reason_code: {type: [string, 'null'], enum: [JOURNEY_ABORTED, null]}
    Journey:
      type: object
      required: [id, traveler_id, title, city_code, timezone, start_at, end_at, budget, status, live_view]
      properties:
        id: {type: string, format: uuid}
        traveler_id: {type: string, format: uuid}
        title: {type: string}
        city_code: {type: string}
        timezone: {type: string}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        budget: {$ref: '#/components/schemas/Money'}
        planning_mode: {$ref: '#/components/schemas/PlanningMode'}
        status: {type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, CANCELLED]}
        active_plan_version_id: {type: [string, 'null'], format: uuid}
        current_activity_id: {type: [string, 'null'], format: uuid}
        # ORD-0520: the two abort facts as stored, plus the live-screen decision.  Both columns are
        # NULL for a trip that was never aborted, so a pre-existing row reports no moment and no
        # reason rather than an invented one.
        aborted_at: {type: [string, 'null'], format: date-time}
        abort_reason: {type: [string, 'null']}
        live_view: {$ref: '#/components/schemas/JourneyLiveView'}
    RecycleBinJourney:
      description: >-
        ORD-0402 slice 1: a journey as `getJourney` answers it, plus the two bin facts read from
        `journeys.deleted_at`.  `deleted_at` is never null in this shape - a row with no deletion
        moment belongs to `listJourneys`, not to the bin - and `bin_state` has one value so a
        screen never reconstructs "it was deleted" from absence in another list.
      allOf:
        - {$ref: '#/components/schemas/Journey'}
        - type: object
          required: [deleted_at, bin_state]
          properties:
            deleted_at: {type: string, format: date-time}
            bin_state: {type: string, enum: [IN_RECYCLE_BIN]}
    MemberRole:
      type: string
      description: >-
        Three tiers, each answering what that person may do through the ACL door below.  The words
        are checked in the store too (`backend/db/schema.sql`).
      enum: [OWNER, ADMIN, COLLABORATOR]
    MemberState:
      type: string
      description: >-
        Derived from the row's own columns, never stored.  Prefixed because bare EXPIRED and WITHDRAWN
        already mean something to accommodation offers (`backend/app/stay_mobility.py`).
      enum: [MEMBER_IN_FORCE, MEMBER_LAPSED, MEMBER_WITHDRAWN]
    JourneyCapability:
      type: string
      enum: [JOURNEY_READ, JOURNEY_UPDATE, PLACE_EDIT, MEMBER_MANAGE, SHARE_GRANT_MANAGE]
    JourneyMemberCreate:
      type: object
      additionalProperties: false
      required: [traveler_id, role, invited_by]
      properties:
        traveler_id: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/MemberRole'}
        invited_by: {type: string, minLength: 1, maxLength: 120}
        expires_at: {type: [string, 'null'], format: date-time}
    JourneyMemberRoleChange:
      # ORD-0503: a role move names both halves -- the seat to move and the traveller asking for it.
      # `extra="forbid"` on the model and `additionalProperties: false` here are the same promise:
      # a body cannot smuggle a second actor, a self-declared state, or an `invited_by` into a change.
      type: object
      additionalProperties: false
      required: [role, actor_traveler_id]
      properties:
        role: {$ref: '#/components/schemas/MemberRole'}
        actor_traveler_id: {type: string, format: uuid}
    JourneyMemberSelfExit:
      # One field, and it is the caller.  There is no target on purpose: a door that accepted a
      # member id here would be the withdraw door wearing a different name.
      type: object
      additionalProperties: false
      required: [traveler_id]
      properties:
        traveler_id: {type: string, format: uuid}
    MemberRoleLimits:
      # The server's own cap and the seats spent under it, so the roster line quotes an answer
      # instead of a number copied into a screen.  `max_administrators` is named a second time above
      # as `x-citynexus-max-administrators-per-journey`; an arm compares the two spellings with the
      # constant the refusing door reads.
      type: object
      required: [max_administrators, admin_count_in_force, roles]
      properties:
        max_administrators: {type: integer, minimum: 1}
        admin_count_in_force: {type: integer, minimum: 0}
        roles:
          type: array
          minItems: 3
          items: {$ref: '#/components/schemas/MemberRole'}
    JourneyCheckinCreate:
      # ORD-0476: what stamping a footprint asks for.  Exactly one of the two ids must be present, and
      # the door refuses both readings of that with a name -- the contract says it here because the
      # shape cannot: JSON Schema `oneOf` over two optional properties would still accept `{}`.
      # `stamped_at` is absent on purpose; the server owns that instant.
      type: object
      properties:
        activity_id: {type: string, minLength: 1, maxLength: 64}
        place_id: {type: string, minLength: 1, maxLength: 64}
        note: {type: [string, 'null'], maxLength: 280}
    JourneyCheckin:
      # One stamp as the store holds it, with the target resolved at read time rather than copied.
      # `target_kind` / `target_key` are the door's own decision, written once and never re-derived,
      # so they still say what was stamped after the target row has been deleted underneath it.
      type: object
      required:
        [id, journey_id, activity_id, place_id, target_kind, target_key, stamped_at, note, source,
         activity_title, activity_type, place_name, place_category]
      properties:
        id: {type: string}
        journey_id: {type: string}
        activity_id: {type: [string, 'null']}
        place_id: {type: [string, 'null']}
        target_kind: {type: string, enum: [ACTIVITY, PLACE]}
        target_key: {type: string}
        stamped_at: {type: string, format: date-time}
        note: {type: [string, 'null']}
        source: {type: string, enum: [FOREGROUND_WEB]}
        activity_title: {type: [string, 'null']}
        activity_type: {type: [string, 'null']}
        place_name: {type: [string, 'null']}
        place_category: {type: [string, 'null']}
    JourneyMember:
      type: object
      required: [id, journey_id, traveler_id, role, invited_by, expires_at, joined_at, removed_at, created_at, updated_at, member_state]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        traveler_id: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/MemberRole'}
        invited_by: {type: string}
        expires_at: {type: [string, 'null'], format: date-time}
        joined_at: {type: [string, 'null'], format: date-time}
        removed_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        member_state: {$ref: '#/components/schemas/MemberState'}
    JourneyRoleRule:
      type: object
      required: [role, capabilities, scope_message_key]
      properties:
        role: {$ref: '#/components/schemas/MemberRole'}
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/JourneyCapability'}
        scope_message_key:
          type: string
          description: >-
            A dictionary key, not a sentence: the words stay on the side that owns the language.
    ShareVisibility:
      type: string
      description: >-
        The store checks this list too (`backend/db/schema.sql`).  PRIVATE and INVITEES_ONLY are
        storable but not link-readable in this step - there is no member data to check a holder
        against yet - so a token for either answers SHARE_GRANT_NOT_LINK_READABLE rather than
        reading as open.
      enum: [PRIVATE, LINK_READ, INVITEES_ONLY, PUBLIC]
    ShareGrantCreate:
      type: object
      additionalProperties: false
      required: [visibility, created_by]
      properties:
        visibility: {$ref: '#/components/schemas/ShareVisibility'}
        created_by: {type: string, minLength: 1, maxLength: 120}
        expires_at: {type: [string, 'null'], format: date-time}
        # ORD-0466: cut the grant for one plan version instead of for the journey.  Absent or null
        # means a journey-level grant, which is what every grant this table already holds is.
        plan_version_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The one version this grant opens.  Three named answers on this door: an id that cannot be
            read is 422 SHARE_GRANT_VERSION_ID_UNREADABLE, an id no version carries is 422
            SHARE_GRANT_VERSION_UNKNOWN, and a version that belongs to another journey is 409
            SHARE_GRANT_VERSION_NOT_IN_JOURNEY - no token is minted on any of those three paths.
    ShareGrant:
      type: object
      required: [id, journey_id, visibility, created_by, expires_at, revoked_at, created_at, updated_at, token, plan_version_id]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        visibility: {$ref: '#/components/schemas/ShareVisibility'}
        plan_version_id:
          type: [string, 'null']
          format: uuid
          description: >-
            null is the journey-level grant, not an unfinished choice: it is the shape every row
            written before ORD-0466 already had.
        created_by: {type: string}
        expires_at:
          type: [string, 'null']
          format: date-time
          description: null means no deadline was ever set - not a far-future date, not the server's clock.
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: null means this grant has never been withdrawn.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        token:
          type: string
          description: >-
            The whole capability a holder needs.  It is a random value the server minted, not the
            journey id, so withdrawing a grant cannot be worked around by knowing a trip's address.
    ShareGrantRevoked:
      type: object
      required: [id, journey_id, visibility, revoked_at, already_revoked]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        visibility: {$ref: '#/components/schemas/ShareVisibility'}
        revoked_at: {type: string, format: date-time}
        already_revoked:
          type: boolean
          description: >-
            False on the withdrawal that did it.  A repeat withdrawal is refused with
            SHARE_GRANT_ALREADY_REVOKED instead of answering the same thing twice.
    SharedActivityCoordinate:
      description: >-
        ORD-0465: where the place an activity names actually is, and which of the two "it is not"
        cases this is.  The four `state` words are the frozen capability axis this product already
        uses everywhere a position is answered (`READY`, `HYDRATABLE`, `UNKNOWN_RETRYABLE`,
        `UNAVAILABLE`), and nothing here invents a position: when there is no place to join, or the
        place carries no coordinate, `latitude` and `longitude` stay null and `reason` says why.  The
        owner's own map reads the same pair from the same function, so a guest screen and an owner
        screen cannot disagree about whether a stop has a place on it.
      type: object
      required: [state, reason, latitude, longitude, coordinate_system, source_coordinate_system]
      properties:
        state: {type: string, enum: [READY, HYDRATABLE, UNKNOWN_RETRYABLE, UNAVAILABLE]}
        reason: {type: [string, 'null']}
        latitude: {type: [number, 'null']}
        longitude: {type: [number, 'null']}
        coordinate_system: {type: [string, 'null']}
        source_coordinate_system: {type: [string, 'null']}
    SharedStop:
      description: >-
        One stop as far as someone who did not plan it is concerned.  Deliberately absent, and each
        absence is a decision: `locked` and `protected` are the owner's editing flags and a reader has
        no control to act on them with; `metadata` is the store's record of what a transition wrote,
        which is not where a traveller's position comes from; `place_id` and `city_service_id` are
        identities this screen never draws with.
      type: object
      required: [id, sequence_no, title, place_name, activity_type, start_at, end_at, coordinate]
      properties:
        id: {type: string, format: uuid}
        sequence_no: {type: integer}
        title:
          type: string
          description: What the plan calls this stop. A planner typed it, so it is not always the name of the thing.
        place_name:
          type: [string, 'null']
          description: >-
            The place row's own name, read off the identity the activity carries; null when there is no
            row to read it from.  A landing screen says this one first and falls back to `title` only
            when the store has no name -- which is a fact about the store, so both ride on the answer.
        activity_type: {type: string}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        coordinate: {$ref: '#/components/schemas/SharedActivityCoordinate'}
    SharedPlan:
      description: >-
        The plan this grant lets its holder read, as a list of stops and nothing else.  `legs` are
        absent on purpose: a leg's geometry comes from a routing provider, and this deployment has none
        configured, so the only shapes available are frozen fixture geometry.  Drawing a route the
        server cannot honestly name would be a second claim about how a traveller moves.
      type: object
      required: [id, version_no, source, stops]
      properties:
        id: {type: string, format: uuid}
        version_no: {type: integer}
        source:
          type: string
          enum: [INITIAL, REPLAN, MANUAL]
          description: >-
            Which generation of the trip this is, read off `plan_versions.source`.  The traveller-facing
            words for these three values already exist on the front
            (`frontend/src/lib/displayVocabulary.ts`), so a guest screen can say 首次生成 / 来自一次重规划
            without inventing a sentence -- and without one, "the trip you were sent" and "the trip you
            were sent, three replans later" are the same words.
          # The plan's own `status` is deliberately not on this answer: two of its five values
          # (SELECTED, SUPERSEDED) have no entry in the shared status table
          # (`frontend/src/i18n/travelerLabels.ts`), so a screen handed the field could only echo a
          # machine word at a traveller.  Every enumeration this door does offer is pinned to have a
          # label for each of its values, by
          # `backend/tests/test_qoder_ord0465_shared_landing.py`.
        stops:
          type: array
          items: {$ref: '#/components/schemas/SharedStop'}
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: {type: integer, minimum: 0}
        currency: {type: string, minLength: 3, maxLength: 3}
    ConstraintInput:
      type: object
      required: [kind, category, rule_code]
      properties:
        kind: {type: string, enum: [HARD, SOFT]}
        category: {type: string}
        rule_code: {type: string}
        params: {type: object, additionalProperties: true, default: {}}
        weight: {type: number, minimum: 0, default: 1}
    Constraint:
      allOf:
        - {$ref: '#/components/schemas/ConstraintInput'}
        - type: object
          required: [id, journey_id, active]
          properties:
            id: {type: string, format: uuid}
            journey_id: {type: string, format: uuid}
            active: {type: boolean}
    Place:
      type: object
      required: [id, name, category, location, city_code, provider_key, coordinate_system, source_coordinate_system]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string}
        city_code: {type: string}
        location: {$ref: '#/components/schemas/GeoPoint'}
        tags: {type: array, items: {type: string}}
        provider_key: {type: string}
        # The system the stored geometry is written in; NOT NULL in the schema.
        coordinate_system: {type: string}
        # What the provider handed us before any conversion.  The key is always in
        # the body -- FastAPI says so too, once the route declares response_model --
        # and a null value is the server answering "never recorded", which is not the
        # same fact as WGS84 and is therefore typed nullable rather than defaulted.
        source_coordinate_system: {type: [string, 'null']}
    CollectionFolderCreate:
      # ORD-0444: what creating a shelf asks for -- its name and whose it is.  The name's bounds are
      # copied from `TravelerCreate`'s `display_name` rather than invented, and the name is stored
      # verbatim -- there is no rename door yet, so this is the name the shelf reads for its whole
      # life.  `owner_traveler_id` is the 成员归属, validated against `travelers` at the door.
      type: object
      required: [name, owner_traveler_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        owner_traveler_id: {type: string, minLength: 1, maxLength: 64}
    CollectionItemCreate:
      # `place_id` is a plain string because `places.id` is a string column, not a UUID: a
      # uuid-formatted parameter would answer a real place with `validation.not_an_id`.
      type: object
      required: [place_id]
      properties:
        place_id: {type: string, minLength: 1, maxLength: 64}
        note: {type: [string, 'null'], maxLength: 280}
    CollectionItem:
      # One shelf row with the place behind it resolved from `places` at answer time.
      # There is no `address` and no cover image, and that is a measured gap rather than an
      # omission: `places` has no address column among its 14, and its `metadata_json` holds
      # `cost_minor` / `duration_min` / `accessibility_evidence` and nothing address-shaped.
      # A screen that printed 「地址」 would be printing a label over nothing.
      type: object
      required: [id, folder_id, place_id, name, category, city_code, location,
                 provider_key, coordinate_system, note, added_at]
      properties:
        id: {type: string}
        folder_id: {type: string}
        place_id: {type: string}
        name: {type: string}
        category: {type: string}
        city_code: {type: string}
        location: {$ref: '#/components/schemas/GeoPoint'}
        provider_key: {type: string}
        coordinate_system: {type: string}
        # null means no note was ever written -- a different fact from an empty one.
        note: {type: [string, 'null']}
        added_at: {type: string}
    CollectionFolder:
      # A shelf and its rows in one answer.  `item_count` is the length of this same payload's
      # `items` array (`backend/app/services.py` -- `collection_folder_schema`), so the number and
      # the rows beneath it cannot describe two different reads.
      # `owner_traveler_id` is the 成员归属 the row carries, and `listCollections` scopes by it.
      # There is still no pagination or sort parameter on that door, and no promise that the id was
      # authenticated -- asserting it is what this version does.
      type: object
      required: [id, name, owner_traveler_id, created_at, updated_at, item_count, items]
      properties:
        id: {type: string}
        name: {type: string}
        owner_traveler_id: {type: string}
        # Written equal at creation and left alone afterwards: adding a row writes
        # `collection_items`, not this row, so `updated_at` stays "when this shelf row was last
        # written" instead of becoming a second, contradicting account of the shelf.
        created_at: {type: string}
        updated_at: {type: string}
        item_count: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/CollectionItem'}}
    RealCityDiscoveryCandidate:
      type: object
      x-fastapi-extra: allow
      required: [id, external_id, provider_key, name, category, latitude, longitude, tags,
                 distance_m, opening_hours, metadata, cost_evidence, materialized_place_id,
                 coordinate_system, source_coordinate_system]
      properties:
        id: {type: string}
        external_id: {type: string}
        provider_key: {type: string}
        name: {type: string}
        category: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        tags: {type: array, items: {type: string}}
        distance_m: {type: [number, 'null']}
        opening_hours: {type: object}
        metadata: {type: object}
        cost_evidence: {type: object}
        materialized_place_id: {type: string}
        coordinate_system: {type: string}
        source_coordinate_system: {type: [string, 'null']}
    RealCityDiscoveryResponse:
      type: object
      x-fastapi-extra: allow
      required: [journey_id, city_code, city_context, mode, captured_at, expires_at,
                 provider_status, provider_evidence, provenance, runtime_provenance, candidates]
      properties:
        journey_id: {type: string}
        city_code: {type: string}
        city_context: {type: string}
        mode: {type: string}
        captured_at: {type: string}
        expires_at: {type: string}
        provider_status: {type: object}
        provider_evidence: {type: object}
        provenance: {type: string}
        runtime_provenance: {type: string}
        candidates: {type: array, items: {$ref: '#/components/schemas/RealCityDiscoveryCandidate'}}
    CityService:
      type: object
