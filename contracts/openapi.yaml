  /journeys/{journey_id}/inbox/import:
    post:
      operationId: importJourneyReservation
      responses:
        '201': {description: Reservation draft extracted without inventing critical facts, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/inbox:
    get:
      operationId: listJourneyInbox
