  a-pending-destination-is-a-request-not-a-place:
    # 契约原文：`arbiter/anywhere-contract` → docs/pending_destination_identity_policy.md @ `e4b7faa3`
    # 冻结句：Unknown destination text may identify a request to resolve a destination;
    #        it does not identify a destination.
    rule: >-
      目的地解析只有四个结论：RESOLVED / AMBIGUOUS / NO_MATCH / RUNTIME_FAILURE。
      后三者的 `canonical_destination_id` 一律 **null**；用户的原话进 `pending_destination_label`
      （逐字，绝不 `_normalise`），用来匹配的字面进 `resolver_query_normalized`（也不是身份），
      关联/幂等 token 叫 `destination_pending_key`（**correlation only, never identity**：
      不得当 place/destination id 暴露、不得进 planner、不得作为目录 join 键）。
      AMBIGUOUS 不得猜赢家，候选单独成栏；RUNTIME_FAILURE 必须可重试且**绝不**写成结构性结论（R1）。
      未解析请求的幂等靠 `pending-request-v1` 请求指纹（归一化语义 + scope + 三个版本），
      里面既没有 canonical 也没有原文。已有的 `pending:` 旧行**就地回填、不删不重建**：
      operation id 与历史保留，canonical 置 null，label 从最佳可用 raw source 回填；
      只剩归一化 payload 的行必须标 `LEGACY_NORMALIZED`，不许伪称 exact raw。
    measured-on: f1bdbbe
    gates:
      - backend/tests/test_qoder_pending_destination_identity.py::test_g1_unresolved_text_never_reaches_the_identity_column
      - backend/tests/test_qoder_pending_destination_identity.py::test_g2_no_match_names_itself_and_keeps_identity_null
      - backend/tests/test_qoder_pending_destination_identity.py::test_g3_a_broken_source_is_a_runtime_failure_not_a_structural_no_match
      - backend/tests/test_qoder_pending_destination_identity.py::test_g3b_a_runtime_failure_ends_the_job_retryable_and_never_structural
      - backend/tests/test_qoder_pending_destination_identity.py::test_g3c_the_job_projection_carries_the_same_identity_shape_and_prejudges_nothing
      - backend/tests/test_qoder_pending_destination_identity.py::test_g4_an_ambiguous_query_keeps_identity_null_and_lists_candidates_separately
      - backend/tests/test_qoder_pending_destination_identity.py::test_g5_a_resolved_destination_carries_a_real_canonical_identity
      - backend/tests/test_qoder_pending_destination_identity.py::test_g6_the_stored_label_is_separate_from_the_normalised_resolver_query
      - backend/tests/test_qoder_pending_destination_identity.py::test_g7_punctuation_is_not_lost_when_the_input_is_stored
      - backend/tests/test_qoder_pending_destination_identity.py::test_g8_the_pending_key_cannot_buy_a_place_join
      - backend/tests/test_qoder_pending_destination_identity.py::test_g9_repeated_unresolved_requests_share_one_job_and_invent_no_identity
      - backend/tests/test_qoder_pending_destination_identity.py::test_g10_legacy_pending_rows_migrate_in_place_without_losing_their_ids
      - backend/tests/test_qoder_pending_destination_identity.py::test_g13_rerunning_the_schema_migration_never_duplicates_or_eats_a_row
      - backend/tests/test_qoder_pending_destination_identity.py::test_g11_a_blank_request_answers_a_null_identity_and_echoes_the_input
      - backend/tests/test_qoder_pending_destination_identity.py::test_g12_no_product_module_writes_user_text_into_an_identity_column
