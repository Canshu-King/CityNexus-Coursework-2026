# -----------------------------------------------------------------------------
# ⑤ §9 的矩阵上界：一趟行程最多 20 个可路由节点 —— 数字由实测换算来，不是拍的
# -----------------------------------------------------------------------------
x-matrix-bound:
  max-routable-nodes-per-journey: 20
  unit-of-provider-limit: cells            # sources × targets；见 matrix-preflight-is-in-cells-not-locations
  provider-cells-cap: 100
  tiles-per-costing: ceil(N / 10) ** 2
  costings: 2                              # pedestrian + auto（runtime.py:216 各跑一套）
  derived-rationale: >-
    N=20 ⇒ 每套 costing ⌈20/10⌉² = 4 片，两套共 8 次请求；按实测单次 1018 ms（100 cells、200 OK）
    串行估 ≈ 4.3 s。N=24 ⇒ 9 × 2 = 18 次 ≈ 9.6 s —— 已经越过本附件 x-latency-budget 那一档，
    而且今天是**一把捕获**（runtime.py）：任何一片失败，整趟行程的机动事实全丢。
    所以 20 的含义不是"最多塞得下多少"，是"在延迟预算内还重跑得起一次"的上界。
    要往上抬必须先做两件事：片间并发（把 8 次压成一轮的常数倍）与失败局部化（一片丢只丢那一片的格，
    其余事实照常封存），并且回来改这段依据 —— 不许只在代码里把常数改大。
  measured-on: 68d5474
  open-findings-blocking-a-raise:
    - >-
      valhalla_http.py:185-187：durations 形状这一分支没有把 payload 的 distances 传给
      _normalize_duration_matrix（:178 那条嵌套分支传了）⇒ 同一格 provider 给了距离，规范化之后
      distance_m=None。红门：test_g13d_distance_must_survive_whichever_shape_the_provider_answers。
    - >-
      runtime.py:232 无分片无预检 ⇒ N>10 的行程今天必吃 400/150。红门：
      test_g14b_no_request_may_carry_more_than_100_cells_and_every_pair_survives。
# -----------------------------------------------------------------------------
# ⑥ 服务端真值字段：三个"不得由前端传、不得用默认值冒充"的东西
# -----------------------------------------------------------------------------
x-server-truth-fields:
  rule: >-
    下面三个字段都是**服务端真值**：由服务端算出来、随能力/水合回答一起下发。前端不得把它们当参数
    传进来，不得在本地猜，更不得在缺省时用一个默认值冒充 —— "没有来源的数冒充有来源的数"是
    ORD-0101/0106 那一族谎话的共同形状。
  fields:
    readiness_policy_version:
      status: 已定（仲裁 v0.2，本轮只是登记进附件）
      meaning: 判 READY / PARTIAL / MISSING 的那一版服务端 readiness 策略的版本号
      must: >-
        READY 必须说得出是哪一版判的；换版本之后同一目的地的结论若变了，得能用版本号解释，
        而不是让用户自己看见"昨天能订今天不能订"。
    provider_budget:
      meaning: 每个阶段允许的外呼次数与时间上限（阶段 × {calls, ms}），由服务端算并随回答下发
      stages: [resolver, category_search, fallback_geocode, matrix]
      must:
        - 上限是**服务端给的事实**，不是前端请求里的参数；越界必须停在该阶段并点名 reason_code
        - 与 TTL 联动：命中未过期候选 ⇒ 该阶段记账为 0 次外呼（"这趟没花预算"，不是"少打了一次"）
        - matrix 阶段的界另见 x-matrix-bound（cells ≤ 100、N ≤ 20）
      why: >-
        B 实测暖趟 242.9 s vs 冷趟 238.3 s —— 因为没有任何一份"这趟允许花多少"的账，
        expires_at 写了没人读（real_city.py 只写）。
      gate: backend/tests/test_qoder_anywhere_discovery_truth.py::test_g16b_an_unexpired_candidate_set_must_answer_without_going_outside
    discovery_area:
      meaning: 本次发现所用范围的**来源与几何** —— 必须来自已解析目的地的 extent（行政区多边形或 bbox）
      must:
        - 下发形状含 source（RESOLVED_EXTENT / ADMIN_POLYGON / …）、geometry、以及本次实际发出的范围
        - 只能退化成圆时必须说出半径，并说清它配不配得上目的地尺度；**不得静默地 min(radius_m, 5000)**
        - 前端不得传 discovery_area 来"扩大搜索范围"：范围是目的地的属性，不是查询参数
      why: >-
        real_city.py 现在把 radius_m 硬夹到 5000 m ⇒ "水合一个县"实为"搜县城 5 公里圈"，
        县域里的乡镇一律看不见，能力回答会把 PARTIAL 说成 READY。等车道 C 的 ORD-0114。
