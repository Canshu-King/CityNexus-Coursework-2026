      `integrations/discovery/provider_identity.py` 拿 `ProviderResolution`
      （`outcome / query / normalized_query / candidates / attempts / retryable / reason /
      answered / provider_replied`），四类由 B 定型，C 只决定"这条证据是否成为 CityNexus 的身份"。
      于是"运行性失败不得写成没有这个地方"这套分类在树上只有一份实现；C 侧的门也因此穿过 B 的
      真实分类代码跑（门只换 httpx transport，不换判据）。两个 runtime 现场（provider 答坏 vs
