  broken-provider-evidence-is-a-runtime-failure-and-never-an-identity:
    rule: >-
      provider 答了、而且报 MATCH，不等于它给得出可引用的实体。收成 canonical 之前必须过两条**已被
      验收口径点名**的条件：① 实体引用形如 `<N|W|R>:<正整数>`（OSM 的元素类只有这三个）；② 位置是合法
      WGS84（lat ∈ [-90,90]、lon ∈ [-180,180]，越界只拒绝、不四舍五入、不修值）。任一条不满足 ⇒
      `destination_state=RUNTIME_FAILURE`、`canonical_destination_id=null`、`retryable=true`、
      `destination_resolution=provider_evidence_malformed`、具名 `attribution_reason=PROVIDER_BAD_RESPONSE`
      （沿用 provider 层已有的词，不另造），并且被弃用的那条证据原样进 `malformed_candidates`。
      明确禁止：写成 NO_MATCH（那是在说"世上没这个地方"）、写摘要/占位当身份、把它报成"联系不上"。
    measured-on: 1cce4bf
    measured-before: >-
      修前实测（mocked transport、一次性库、seam=photon、正常入口 GET）：properties 去掉 `osm_type`
      ⇒ state=RESOLVED / canonical=`OSM:unknown:3289208`；`osm_type="Z"` ⇒ canonical=`OSM:Z:3289208`；
      质心 [200.0,120.0] ⇒ 照样收成身份。三者都会被下游当真实地点 join/缓存/引用。
    open-item: >-
      还有一件 C 侧看不到、因此**没有**假装修好的：provider 回了 feature、但每条都没有可用 osm_id 时，
      provider 层在分级阶段就把候选丢掉，交给产品的是 `NO_MATCH + PROVIDER_NO_RESULTS`，与"真的一条都没回"
      在同一个读数上不可区分（`ProviderResolution` 字段实测：outcome/query/normalized_query/candidates/
      attempts/retryable/reason/answered/provider_replied，`ProviderAttempt` 不带会答条数）。要分开这句话
      需要 provider 层把"看到了几条"交出来 ⇒ 已把两侧读数交给 B，不由 C 伸手进 integrations/discovery/** 改。
      今晚把这句话从推断升成实测，并扩了两格：塌陷点就是
      `integrations/discovery/provider_identity.py` 的 `_is_destination_grade`，它同时按
      `props["name"] is None`、`props["osm_id"] is None` **和** `props["type"] not in
      DESTINATION_GRADE_TYPES` 丢弃整条 feature ⇒ 塌成"这个地方不存在"的形状不止缺 id 这一种；
      探针把两侧 dataclass 的字段名整排打印出来，确认没有任何一条报"看到几条"。
      按名点给 B 的口径收窄成一个字段：`ProviderAttempt.features_viewed`
      （等价的 `candidates_before_filter` + 丢弃原因亦可），C 侧拿到它就能把
      "答了但证据不合格"从"答了且确实没有"里分出来；那一天
      `backend/tests/test_qoder_ord197_four_class_receipt.py::test_r1d_a_feature_without_any_usable_id_is_named_malformed_not_absent`
      会以 XPASS 报错（strict），提醒摘标记。
    re-measured: >-
      2026-09-22 @ `d6d5ae6`（父提交上跑，本笔只改门与契约）：
